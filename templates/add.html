<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app-wrapper">

    <div class="phone-shell">

        <main class="add-page">

            <h1 class="screen-title">
                Новый электроприбор
            </h1>

            <div class="add-media-row">

                <div class="add-media-column">

                    <div class="add-media-title">
                        Фото
                    </div>

                    <div class="add-media-preview">

                        <img
                                src="{{ .draft.Image }}"
                                alt="{{ .draft.Name }}">

                    </div>

                </div>


                <div class="add-media-column">

                    <div class="add-media-title">
                        Видео
                    </div>

                    <div class="add-media-preview">

                        {{ if .draft.Video }}

                        <video
                                src="{{ .draft.Video }}"
                                controls
                                muted>
                        </video>

                        {{ else }}

                        <span class="media-empty">
                            Видео не добавлено
                        </span>

                        {{ end }}

                    </div>

                </div>

            </div>


            <form class="draft-form">

                <label class="form-label">

                    Название

                    <input
                            class="form-input"
                            type="text"
                            value="{{ .draft.Name }}">

                </label>


                <label class="form-label">

                    Мощность, кВт

                    <input
                            class="form-input"
                            type="number"
                            step="0.1"
                            value='{{ printf "%.1f" .draft.PowerKW }}'>

                </label>


                <label class="form-label">

                    Расчётная нагрузка на сеть 220В, А

                    <input
                            class="form-input"
                            type="number"
                            step="0.1"
                            value='{{ printf "%.1f" .draft.CurrentA }}'>

                </label>


                <label class="form-label">

                    Описание

                    <textarea
                            class="form-textarea">{{ .draft.Description }}</textarea>

                </label>


                <!--
                Это намеренно НЕ submit.
                Никакой записи в ЛР1 не происходит.
                -->
                <button
                        class="main-button"
                        type="button">

                    Сохранить

                </button>

            </form>

        </main>


        <nav class="bottom-nav">

            <a href="/feed/1">
                <span class="nav-icon">⌂</span>
                <span class="nav-text">Лента</span>
            </a>

            <a href="/add" class="active">
                <span class="nav-icon">＋</span>
                <span class="nav-text">Добавить</span>
            </a>

            <a href="/catalog">
                <span class="nav-icon">▦</span>
                <span class="nav-text">Каталог</span>
            </a>

        </nav>

    </div>

</div>

</body>
</html>
