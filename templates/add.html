<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app-wrapper">

    <div class="phone-shell">

        <main class="add-page">

            <h1 class="screen-title">
                Новый электроприбор
            </h1>

            <div class="add-media-stack">

                <label class="media-picker">

                    <span class="add-media-title">
                        Видео
                    </span>

                    <div class="add-media-preview-wide">

                        <video
                                src="{{ .draft.Video }}"
                                muted
                                autoplay
                                loop
                                playsinline>
                        </video>

                    </div>

                    <span class="media-picker-hint">
                        Нажмите, чтобы выбрать другое видео
                    </span>

                    <input
                            class="media-file-input"
                            type="file"
                            accept="video/*">

                </label>


                <label class="media-picker">

                <span class="add-media-title">
                    Фото
                </span>

                    <div class="add-media-preview-wide">

                        <img
                                src="{{ .draft.Image }}"
                                alt="{{ .draft.Name }}">

                    </div>

                    <span class="media-picker-hint">
                        Нажмите, чтобы выбрать другое фото
                    </span>

                    <input
                            class="media-file-input"
                            type="file"
                            accept="image/*">

                </label>

            </div>


            <div class="draft-form">

                <label class="form-label">

                    Название

                    <input
                            class="form-input"
                            type="text"
                            value="{{ .draft.Name }}">

                </label>


                <label class="form-label">

                    Мощность, кВт

                    <input
                            class="form-input"
                            type="number"
                            step="0.1"
                            value='{{ printf "%.1f" .draft.PowerKW }}'>

                </label>

                <label class="form-label">

                    Описание

                    <textarea
                            class="form-textarea">{{ .draft.Description }}</textarea>

                </label>

            </div>

        </main>


        <nav class="bottom-nav">

            <a href="/electricity_consumers/feed/1">
                <span class="nav-icon">⌂</span>
                <span class="nav-text">Лента</span>
            </a>

            <a href="/electricity_consumers/add" class="active">
                <span class="nav-icon">＋</span>
                <span class="nav-text">Добавить</span>
            </a>

            <a href="/electricity_consumers/catalog">
                <span class="nav-icon">▦</span>
                <span class="nav-text">Каталог</span>
            </a>

        </nav>

    </div>

</div>

</body>
</html>
