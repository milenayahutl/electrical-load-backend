<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавление</title>

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app-wrapper">

    <div class="phone-shell">

        <main class="add-page">

            <h1 class="screen-title">
                Новый электроприбор
            </h1>


            {{ if .hasDraft }}

            <!-- =========================================
                 ЕСТЬ ЧЕРНОВИК -> публикация услуги
                 ========================================= -->

            <div class="add-media-stack">

                <div class="media-picker">

                    <span class="add-media-title">
                        Видео
                    </span>

                    <div class="add-media-preview-wide">

                        {{ if .draft.Video }}

                        <video
                                src="{{ .draft.Video }}"
                                muted
                                autoplay
                                loop
                                playsinline>
                        </video>

                        {{ else }}

                        <video
                                src="/static/media/default.mp4"
                                muted
                                autoplay
                                loop
                                playsinline>
                        </video>

                        {{ end }}

                    </div>

                </div>


                <div class="media-picker">

                    <span class="add-media-title">
                        Фото
                    </span>

                    <div class="add-media-preview-wide">

                        {{ if .draft.Image }}

                        <img
                                src="{{ .draft.Image }}"
                                alt="{{ .draft.Name }}">

                        {{ else }}

                        <img
                                src="/static/media/default.jpg"
                                alt="Фото по умолчанию">

                        {{ end }}

                    </div>

                </div>

            </div>


            <form
                    class="draft-form"
                    action="/electricity_consumers/publish"
                    method="POST">

                <!-- ID черновика пользователь не видит,
                     но он отправляется на сервер -->
                <input
                        type="hidden"
                        name="id"
                        value="{{ .draft.ID }}">


                <label class="form-label">

                    Название

                    <input
                            class="form-input"
                            type="text"
                            value="{{ .draft.Name }}"
                            readonly>

                </label>


                <label class="form-label">

                    Краткое описание

                    <textarea
                            class="form-textarea"
                            name="description"
                            required>{{ .draft.Description }}</textarea>

                </label>


                <label class="form-label">

                    Мощность, кВт

                    <input
                            class="form-input"
                            type="number"
                            name="power_kw"
                            min="0"
                            step="0.1"
                            value='{{ printf "%.1f" .draft.PowerKW }}'
                    required>

                </label>

                <p class="form-hint">
                    Сила тока будет рассчитана автоматически по мощности.
                </p>

                <button
                        class="form-button"
                        type="submit">

                    Опубликовать

                </button>

            </form>


            {{ else }}

            <!-- =========================================
                 ЧЕРНОВИКА НЕТ -> создание услуги
                 ========================================= -->

            <form
                    class="draft-form"
                    action="/electricity_consumers/add"
                    method="POST">


                <div class="add-media-stack">

                    <label class="media-picker">

                        <span class="add-media-title">
                            Видео
                        </span>

                        <div class="add-media-preview-wide">

                            <video
                                    src="/static/media/default.mp4"
                                    muted
                                    autoplay
                                    loop
                                    playsinline>
                            </video>

                        </div>

                        <span class="media-picker-hint">
                            Нажмите, чтобы выбрать видео
                        </span>

                        <!-- name специально НЕТ:
                             файл не отправляется на сервер -->
                        <input
                                class="media-file-input"
                                type="file"
                                accept="video/*">

                    </label>


                    <label class="media-picker">

                        <span class="add-media-title">
                            Фото
                        </span>

                        <div class="add-media-preview-wide">

                            <img
                                    src="/static/media/default.jpg"
                                    alt="Фото по умолчанию">

                        </div>

                        <span class="media-picker-hint">
                            Нажмите, чтобы выбрать фото
                        </span>

                        <!-- name специально НЕТ:
                             файл не отправляется на сервер -->
                        <input
                                class="media-file-input"
                                type="file"
                                accept="image/*">

                    </label>

                </div>


                <label class="form-label">

                    Название

                    <input
                            class="form-input"
                            type="text"
                            name="name"
                            placeholder="Введите название"
                            required>

                </label>


                <button
                        class="form-button"
                        type="submit">

                    Далее

                </button>

            </form>

            {{ end }}

        </main>


        <nav class="bottom-nav">

            <a href="/electricity_consumers/feed/{{ .firstID }}">

                <span class="nav-icon">⌂</span>
                <span class="nav-text">Лента</span>

            </a>


            <a
                    href="/electricity_consumers/add"
                    class="active">

                <span class="nav-icon">＋</span>
                <span class="nav-text">Добавить</span>

            </a>


            <a href="/electricity_consumers/catalog">

                <span class="nav-icon">▦</span>
                <span class="nav-text">Каталог</span>

            </a>

        </nav>

    </div>

</div>

</body>

</html>
