<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Каталог услуг</title>

    <link
            rel="stylesheet"
            href="/static/styles/style.css">
</head>

<body>

<div class="phone">

    <main class="screen catalog-screen">

        <h1 class="page-title">
            Каталог
        </h1>

        <form
                class="power-filter"
                action="/catalog"
                method="GET">

            <span>
                Мощность до
            </span>

            <input
                    type="number"
                    name="max_power"
                    min="0"
                    step="0.1"
                    placeholder="2.0"
                    value="{{ .max_power }}">

            <span>
                кВт
            </span>

            <button type="submit">
                найти
            </button>

        </form>

        {{ if .filterError }}

        <p class="filter-error">
            {{ .filterError }}
        </p>

        {{ end }}

        {{ if .services }}

        <div class="catalog-grid">

            {{ range .services }}

            <a
                    class="catalog-card"
                    href="/feed/{{ .ID }}">

                <!-- Количество лайков -->
                <div class="card-likes">

                    <span>
                        ♡
                    </span>

                    <span>
                        {{ .LikeCount }}
                    </span>

                </div>

                <div class="catalog-image">

                    <img
                            src="{{ .Image }}"
                            alt="{{ .Name }}">

                </div>

                <div class="catalog-info">

                    <h2>
                        {{ .Name }}
                    </h2>

                    <!-- Именно это поле
                         используется для фильтра -->
                    <p class="catalog-power">
                        {{ printf "%.1f" .PowerKW }} кВт
                    </p>

                    <span class="catalog-more">
                        Подробнее
                    </span>

                </div>

            </a>

            {{ end }}

        </div>

        {{ else }}

        <p class="empty-result">
            Подходящих электроприборов нет.
        </p>

        {{ end }}

    </main>

    <nav class="bottom-nav">

        <a href="/feed">

            <span class="nav-symbol">⌂</span>
            <span class="nav-label">Лента</span>

        </a>

        <a href="/add">

            <span class="nav-symbol">＋</span>
            <span class="nav-label">Добавить</span>

        </a>

        <a
                href="/catalog"
                class="active">

            <span class="nav-symbol">▦</span>
            <span class="nav-label">Каталог</span>

        </a>

    </nav>

</div>

</body>

</html>
