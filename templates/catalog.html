<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Каталог</title>

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app-wrapper">

    <div class="phone-shell">

        <main class="catalog-page">

            <h1 class="screen-title">
                Каталог
            </h1>


            <form
                    class="filter-form"
                    action="/catalog"
                    method="GET">

                <span>
                    Мощность до
                </span>

                <input
                        type="number"
                        name="max_power"
                        min="0"
                        step="0.1"
                        placeholder="0"
                        value="{{ .max_power }}">

                <span>
                    кВт
                </span>

                <button type="submit">
                    найти
                </button>

            </form>


            {{ if .filterError }}

            <p class="filter-error">
                {{ .filterError }}
            </p>

            {{ end }}


            {{ if .services }}

            <div class="catalog-grid">

                {{ range .services }}

                <article class="service-card">

                    <div class="card-image-wrap">

                        <img
                                src="{{ .Image }}"
                                alt="{{ .Name }}">

                        <span class="card-like">
                            ♡ {{ len .LikedBy }}
                        </span>

                    </div>


                    <div class="card-body">

                        <h2>
                            {{ .Name }}
                        </h2>

                        <p>
                            {{ printf "%.1f" .PowerKW }} кВт
                        </p>

                        <a href="/feed/{{ .ID }}?full=1">
                            Подробнее
                        </a>

                    </div>

                </article>

                {{ end }}

            </div>

            {{ else }}

            <p class="empty-result">
                Приборы с такой мощностью не найдены.
            </p>

            {{ end }}

        </main>


        <nav class="bottom-nav">

            <a href="/feed/1">

                <span class="nav-icon">⌂</span>
                <span class="nav-label">Лента</span>

            </a>


            <a href="/add">

                <span class="nav-icon">＋</span>
                <span class="nav-label">Добавить</span>

            </a>


            <a href="/catalog" class="active">

                <span class="nav-icon">▦</span>
                <span class="nav-label">Каталог</span>

            </a>

        </nav>

    </div>

</div>

</body>

</html>
