<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лента</title>

    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>

<div class="app-wrapper">

    <div class="phone-shell">

        <main class="feed-screen">

            <video
                    class="feed-video"
                    poster="/static/media/default.jpg"
                    autoplay
                    muted
                    loop
                    playsinline>

                {{ if .electricityConsumer.Video }}

                <source
                        src="{{ .electricityConsumer.Video }}"
                        type="video/mp4">

                {{ end }}

                <source
                        src="/static/media/default.mp4"
                        type="video/mp4">

            </video>

            <div class="feed-gradient"></div>


            <div class="feed-copy">

                <h1>
                    {{ .electricityConsumer.Name }}
                </h1>

                <input
                        class="description-toggle"
                        type="checkbox"
                        id="description-toggle-{{ .electricityConsumer.ID }}">


                <p class="feed-description">
                    {{ .electricityConsumer.Description }}
                </p>


                <label
                        class="feed-more"
                        for="description-toggle-{{ .electricityConsumer.ID }}">

                    <span class="more-text">
                        больше
                    </span>

                    <span class="less-text">
                        меньше
                    </span>

                </label>
            </div>


            <div class="feed-actions">

                <div class="feed-like">

                    <span class="feed-heart">
                        ♡
                    </span>

                    <span class="feed-like-count">
                        {{ len .electricityConsumer.Likes }}
                    </span>

                </div>


                <div class="feed-parameter">

                    <span class="feed-parameter-value">
                        {{ printf "%.1f" .electricityConsumer.PowerKW }}
                    </span>

                    <span class="feed-parameter-unit">
                        кВт
                    </span>

                </div>

                <div class="feed-parameter">

                    <span class="feed-parameter-value">
                        {{ printf "%.1f" .electricityConsumer.CurrentA }}
                    </span>

                    <span class="feed-parameter-unit">
                        А
                    </span>

                </div>

                <a
                        class="feed-next"
                        href="/electricity_consumers/feed/{{ .nextID }}">

                            ↓

                </a>

            </div>

        </main>


        <nav class="bottom-nav">

            <a href="/electricity_consumers/feed/{{ .electricityConsumer.ID }}" class="active">

                <span class="nav-icon">⌂</span>
                <span class="nav-text">Лента</span>

            </a>


            <a href="/electricity_consumers/add">

                <span class="nav-icon">＋</span>
                <span class="nav-text">Добавить</span>

            </a>


            <a href="/electricity_consumers/catalog">

                <span class="nav-icon">▦</span>
                <span class="nav-text">Каталог</span>

            </a>

        </nav>

    </div>

</div>

</body>

</html>
