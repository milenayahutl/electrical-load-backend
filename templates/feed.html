<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Лента</title>

    <link
            rel="stylesheet"
            href="/static/styles/style.css">
</head>

<body>

<div class="phone">

    <main class="screen feed-screen">

        <div class="feed-list">

            {{ range .services }}

            <section
                    class="feed-item"
                    id="service-{{ .ID }}">

                <video
                        class="feed-video"
                        src="{{ .Video }}"
                        poster="{{ .Image }}"
                        autoplay
                        muted
                        loop
                        playsinline>
                </video>

                <!-- Затемнение снизу,
                     чтобы белый текст читался -->
                <div class="feed-gradient"></div>

                <!-- Информация -->
                <div class="feed-info">

                    <h1>
                        {{ .Name }}
                    </h1>

                    <div class="topic-fields">

                        <span>
                            Мощность:
                            {{ printf "%.1f" .PowerKW }} кВт
                        </span>

                        <span>
                            Расчётная нагрузка на сеть 220 В:
                            {{ printf "%.1f" .LoadA }} А
                        </span>

                    </div>

                    <p class="feed-description">
                        {{ .Description }}
                    </p>

                    <button
                            class="description-toggle"
                            type="button">
                        больше
                    </button>

                </div>

                <!-- Лайки + следующий -->
                <div class="feed-actions">

                    <div class="like-block">

                        <div class="heart-circle">
                            <span class="heart-icon">♡</span>
                        </div>

                        <span class="like-count">
                            {{ .LikeCount }}
                        </span>

                    </div>

                    <button
                            class="next-button"
                            type="button"
                            title="Следующее видео">
                        ↓
                    </button>

                </div>

            </section>

            {{ end }}

        </div>

    </main>

    <nav class="bottom-nav">

        <a
                href="/feed"
                class="active">

            <span class="nav-symbol">⌂</span>
            <span class="nav-label">Лента</span>

        </a>

        <a href="/add">

            <span class="nav-symbol">＋</span>
            <span class="nav-label">Добавить</span>

        </a>

        <a href="/catalog">

            <span class="nav-symbol">▦</span>
            <span class="nav-label">Каталог</span>

        </a>

    </nav>

</div>

<script src="/static/scripts/app.js"></script>

</body>

</html>
